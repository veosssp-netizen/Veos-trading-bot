<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US30 Signal Desk (1H Technicals)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 480px; }
        header { text-align: center; margin-bottom: 16px; }
        h1 { font-size: 1.4rem; color: #ffffff; margin-bottom: 4px; }
        .details { font-size: 0.85rem; color: #8b949e; }
        .status-card {
            background: #161b22; border: 1px solid #30363d; border-radius: 12px;
            padding: 18px; text-align: center; margin-bottom: 16px;
        }
        .signal-box {
            font-size: 2.2rem; font-weight: bold; padding: 14px;
            border-radius: 8px; margin: 10px 0; letter-spacing: 1px;
        }
        .wait { background-color: #3b4351; color: #f0f6fc; }
        .buy-bias { background-color: #238636; color: #ffffff; }
        .sell-bias { background-color: #da3633; color: #ffffff; }
        .price-tag { font-size: 1.3rem; color: #58a6ff; font-weight: bold; margin-top: 4px; }
        
        .indicator-card {
            background: #161b22; border: 1px solid #30363d; border-radius: 12px;
            padding: 16px; margin-bottom: 16px;
        }
        .indicator-card h3 {
            margin-top: 0; font-size: 1rem; color: #ffffff;
            border-bottom: 1px solid #30363d; padding-bottom: 8px;
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin-top: 8px; }
        th, td { text-align: left; padding: 10px 4px; border-bottom: 1px solid #21262d; }
        th { color: #8b949e; }
        .val-overbought { color: #f85149; font-weight: bold; }
        .val-oversold { color: #3fb950; font-weight: bold; }
        .val-neutral { color: #e3b341; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>US30 Signal Desk</h1>
            <div class="details">1H Multi-Indicator Matrix (Chart Replica)</div>
        </header>

        <div class="status-card">
            <div class="details">SYSTEM EXECUTION BIAS</div>
            <div id="signalDisplay" class="signal-box wait">WAIT</div>
            <div id="priceDisplay" class="price-tag">US30: $52,713.60</div>
            <div id="lastUpdated" class="details">Syncing...</div>
        </div>

        <div class="indicator-card">
            <h3>1H Indicator Readouts</h3>
            <table>
                <thead>
                    <tr><th>Indicator</th><th>Value</th><th>Condition</th></tr>
                </thead>
                <tbody>
                    <tr>
                        <td><strong>CCI (14)</strong></td>
                        <td id="cciVal">105.22</td>
                        <td id="cciStatus" class="val-overbought">OVERBOUGHT</td>
                    </tr>
                    <tr>
                        <td><strong>MACD</strong></td>
                        <td id="macdVal">60.6</td>
                        <td id="macdStatus" class="val-neutral">BULLISH HISTOGRAM</td>
                    </tr>
                    <tr>
                        <td><strong>Stoch RSI</strong></td>
                        <td id="stochVal">84.76</td>
                        <td id="stochStatus" class="val-overbought">OVERBOUGHT</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchTrackerState() {
            try {
                const response = await fetch('/api/webhook');
                const data = await response.json();
                
                const signalBox = document.getElementById('signalDisplay');
                const priceDisplay = document.getElementById('priceDisplay');
                const lastUpdated = document.getElementById('lastUpdated');

                const bias = data.overallBias || 'WAIT';
                signalBox.className = 'signal-box ' + (bias === 'BUY' ? 'buy-bias' : bias === 'SELL' ? 'sell-bias' : 'wait');
                signalBox.innerText = bias;

                priceDisplay.innerText = 'US30: $' + (data.lastPrice || '52,713.60');
                lastUpdated.innerText = 'Synced: ' + new Date(data.lastUpdated).toLocaleTimeString();

                document.getElementById('cciVal').innerText = data.cci || '105.22';
                document.getElementById('cciStatus').innerText = data.cciStatus || 'OVERBOUGHT';
                
                document.getElementById('macdVal').innerText = data.macd || '60.6';
                
                document.getElementById('stochVal').innerText = data.stochRsi || '84.76';
                document.getElementById('stochStatus').innerText = data.stochRsiStatus || 'OVERBOUGHT';
            } catch (e) {
                console.error("Sync error:", e);
            }
        }

        fetchTrackerState();
        setInterval(fetchTrackerState, 5000);
    </script>
</body>
    </html>
